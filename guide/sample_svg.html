  document.querySelector('.car-svg').setAttribute('viewBox','190 0 760 1070');
}
'use strict';
const PART_NAMES = {"01": "프론트범퍼", "02": "리어범퍼", "03": "보닛", "04": "트렁크리드", "05": "백도어", "06": "프론트도어(좌)", "07": "프론트도어(우)", "08": "리어도어(좌)", "09": "리어도어(우)", "10": "프론트펜더(좌)", "11": "프론트펜더(우)", "12": "리어펜더(좌)", "13": "리어펜더(우)", "14": "앞유리", "15": "선루프", "16": "루프", "17": "슬라이딩도어(좌)", "18": "슬라이딩도어(우)", "19": "리어유리", "20": "라디에이터 그릴", "21": "헤드램프(좌)", "22": "헤드램프(우)", "23": "리어컴비네이션(좌)", "24": "리어컴비네이션(우)", "25": "사이드스텝(좌)", "26": "사이드스텝(우)", "27": "센터필러(좌)", "28": "센터필러(우)"};
const LABEL_POSITIONS = {"01": [360, 116], "02": [359, 824], "03": [362, 227], "04": [362, 779], "05": [363, 700], "06": [113, 382], "07": [610, 392], "08": [113, 499], "09": [610, 509], "10": [135, 240], "11": [591, 248], "12": [137, 654], "13": [590, 662], "14": [362, 345], "15": [363, 457], "16": [362, 533], "19": [362, 621], "20": [363, 69], "21": [273, 77], "22": [455, 77], "23": [274, 780], "24": [451, 780], "25": [40, 429], "26": [690, 437], "27": [184, 463], "28": [541, 472]};
Object.assign(LABEL_POSITIONS,{'01':[362,57],'20':[362,14],'21':[264,8],'22':[461,8],'02':[362,879],'04':[362,839],'23':[274,832],'24':[450,832],'26':[680,489],'10':[153,267],'07':[616,410]});
const NS='http://www.w3.org/2000/svg';
const carSvg=document.querySelector('.car-svg');
let currentData={detach:new Set(),paint:new Set()};
function node(tag,attrs,text){const el=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,v));if(text!==undefined)el.textContent=text;return el;}
function normalize(value){const list=Array.isArray(value)?value:String(value??'').split(/[\s,]+/);return [...new Set(list.filter(v=>String(v).trim()!=='').map(v=>String(v).trim().padStart(2,'0')))];}
function state(code){const d=currentData.detach.has(code),p=currentData.paint.has(code);return d&&p?'both':d?'detach':p?'paint':null;}
function stateText(code){return ({both:'도장 + 탈착',detach:'탈착',paint:'도장'})[state(code)]||'수리 이력 없음';}
function selectPart(code){carSvg.querySelectorAll('.part').forEach(p=>p.classList.toggle('selected',p.dataset.code===code));document.getElementById('selection').innerHTML='<strong>'+PART_NAMES[code]+'</strong><span class="detail-state">'+stateText(code)+'</span><span>부위 코드 '+code+' · '+(state(code)?'해당 외판 패널의 수리 이력이 있습니다.':'해당 부위에 등록된 수리 이력이 없습니다.')+'</span>';const boxes={front:'225 -74 280 265',rear:'232 790 260 137',left:'55 320 158 286',right:'513 327 158 286',top:'232 280 264 350'};const side=['01','20','21','22'].includes(code)?'front':['02','04','23','24'].includes(code)?'rear':['06','08','10','12','25','27'].includes(code)?'left':['07','09','11','13','26','28'].includes(code)?'right':'top';document.getElementById('detail-icon').innerHTML='<svg viewBox="'+boxes[side]+'" aria-hidden="true"><use href="#vehicle-details"/></svg>';}
function icon(type){return '<svg aria-hidden="true" viewBox="0 0 24 24"><use href="#'+type+'-icon"/></svg>';}
// Public API: setRepairData({'r502-20':['07','10','20','26'],'r502-21':['02','10','26']}).
// Original sample.html format is also accepted: setRepairData('107 110 120 126 202 210 226').
// Every call replaces the previous state; an empty object clears the diagram.
window.setRepairData=function(data={}){
 if(typeof data==='string'){const legacy=data.trim().split(/\s+/).filter(Boolean);if(legacy.some(v=>! /^[12]\d{2}$/.test(v)))throw new Error('기존 코드 형식은 107 202처럼 입력하세요.');data={'r502-20':legacy.filter(v=>v[0]==='1').map(v=>v.slice(1)),'r502-21':legacy.filter(v=>v[0]==='2').map(v=>v.slice(1))};}
 if(!data||typeof data!=='object')throw new Error('수리 코드 객체를 전달하세요.');
 const detach=normalize(data['r502-20']),paint=normalize(data['r502-21']);
 const all=[...new Set([...detach,...paint])];const invalid=all.filter(c=>!PART_NAMES[c]);if(invalid.length)throw new Error('알 수 없는 부위 코드: '+invalid.join(', '));
 const unsupported=all.filter(c=>c==='17'||c==='18');
 currentData={detach:new Set(detach.filter(c=>LABEL_POSITIONS[c])),paint:new Set(paint.filter(c=>LABEL_POSITIONS[c]))};
 const labels=document.getElementById('labels');labels.replaceChildren();
 carSvg.querySelectorAll('.part').forEach(part=>{const code=part.dataset.code;const s=state(code);part.dataset.state=s||'none';part.querySelector('.surface').setAttribute('fill','url(#'+(s||part.dataset.base)+')');part.querySelector('title').textContent=code+' '+PART_NAMES[code]+' · '+stateText(code);part.setAttribute('aria-label',part.querySelector('title').textContent);});
 Object.entries(LABEL_POSITIONS).forEach(([code,[x,y]])=>{
  // Text and badges remain upright above the axonometric panel plane.
  const px=x+220,py=y+120;
  const s=state(code);const group=node('g',{transform:`translate(${px} ${py})`,'data-label-code':code});
  if(!s){group.append(node('text',{'text-anchor':'middle',y:4,fill:'#45647c','font-size':10,'font-weight':650,class:'code-label'},code));}
  if(s){const types=[...(currentData.detach.has(code)?['detach']:[]),...(currentData.paint.has(code)?['paint']:[])];types.forEach((type,i)=>{const cx=(i-(types.length-1)/2)*46;group.append(node('circle',{cx,cy:0,r:22,fill:type==='detach'?'#087cfa':'#f12949',stroke:'white','stroke-width':3,filter:'url(#shadow)'}));group.append(node('use',{href:'#'+type+'-icon',x:cx-11,y:-11,width:22,height:22,color:'white','data-operation':type}));});}
  labels.append(group);
 });
 carSvg.querySelectorAll('.repair-hatch').forEach(el=>el.remove());carSvg.querySelectorAll('.part[data-state=both]').forEach(part=>{const overlay=part.querySelector('.surface').cloneNode(true);overlay.removeAttribute('id');overlay.setAttribute('class','repair-hatch');overlay.setAttribute('fill','url(#both-stripes)');overlay.setAttribute('stroke','none');overlay.setAttribute('pointer-events','none');part.append(overlay);});
 const affected=all.filter(c=>LABEL_POSITIONS[c]).sort();document.getElementById('count').textContent=affected.length;
 document.getElementById('repair-list').innerHTML=affected.map(code=>'<button type="button" class="row" data-select="'+code+'"><span class="code">'+code+'</span><span><strong>'+PART_NAMES[code]+'</strong><span class="status">'+(currentData.detach.has(code)?'<span>'+icon('detach')+'탈착</span>':'')+(currentData.paint.has(code)?'<span>'+icon('paint')+'도장</span>':'')+'</span></span></button>').join('')||'<p>외판 수리 이력이 없습니다.</p>';
 document.getElementById('detach-input').value=detach.join(', ');document.getElementById('paint-input').value=paint.join(', ');
 document.getElementById('input-message').textContent=unsupported.length?'승용차에 없는 슬라이딩도어 코드 '+unsupported.join(', ')+'는 도면에서 제외했습니다.':'';
 const selected=carSvg.querySelector('.part.selected');if(selected)selectPart(selected.dataset.code);
 return {applied:affected,unsupported};
};
carSvg.querySelectorAll('.part').forEach(part=>{part.addEventListener('click',()=>selectPart(part.dataset.code));part.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPart(part.dataset.code);}});});
document.getElementById('repair-list').addEventListener('click',e=>{const row=e.target.closest('[data-select]');if(row)selectPart(row.dataset.select);});
document.getElementById('data-form').addEventListener('submit',e=>{e.preventDefault();try{setRepairData({'r502-20':document.getElementById('detach-input').value,'r502-21':document.getElementById('paint-input').value});}catch(error){document.getElementById('input-message').textContent=error.message;}});
setRepairData({'r502-20':['07','10','20','26'],'r502-21':['02','10','26']});

selectPart('07');
if(embeddedMode){
 const reportSize=()=>parent.postMessage({type:'car-diagram-height',height:Math.ceil(document.querySelector('.stage').getBoundingClientRect().height)},'*');
 new ResizeObserver(reportSize).observe(document.querySelector('.stage'));
 reportSize();
}
